<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact & Follow-up Tracker · สาธิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, soft, capable — the coordinator's desk at the Thai Future Food Trade Association
   IDEA: a pastel planner page from a future-food kitchen: sprouts, beans and leaves keep the to-do list
   PICTURE: pastel gradient hero with "Nong Tua" the soybean-sprout mascot + overdue figure on a pink-peach slab
   COLOUR and TYPE: blush → peach → mint → lavender gradient ground, plum ink; Mitr rounded headings + IBM Plex Sans Thai
   LAYOUT: top bar with icon tabs, hero, KPI tiles with round pastel icons, two columns of lists, breakdown bars */
:root{color-scheme:light dark;
--bg:light-dark(#fffafc,#1d1724);--ink:light-dark(#3d2a45,#f6ecf8);--mute:light-dark(#86708d,#bfaec6);
--line:light-dark(#f0e0ec,#3a2f45);--soft:light-dark(#fbf1f7,#2a2233);--card:light-dark(rgba(255,255,255,.82),rgba(42,34,51,.85));
--pink:#ffb3cf;--peach:#ffd6a8;--mint:#b5ecd4;--lav:#d7c4fa;--sky:#bfe3ff;--lemon:#fff1a8;
--pinkD:light-dark(#d6457c,#ff9ec3);--mintD:light-dark(#1f7a55,#7fe0b6);--lavD:light-dark(#7a4fd0,#c9b0ff);
--late:light-dark(#ffd0d8,#5a2433);--lateInk:light-dark(#8f1236,#ffb3c2);--soon:light-dark(#ffe6c7,#4d3a22);--soonInk:light-dark(#7a4300,#ffd59e);
--g1:light-dark(#fff0f6,#241a2b);--g2:light-dark(#fff6ec,#221c2b);--g3:light-dark(#f0fbf5,#1c2228);--g4:light-dark(#f5f1ff,#211d2e);
--grad:linear-gradient(135deg,#ffc2d9 0%,#ffdcb8 35%,#c9f0dc 70%,#ddd0fb 100%)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{min-height:100%;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 30%,var(--g3) 65%,var(--g4) 100%) fixed;background-color:var(--g1)}
body{margin:0;color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num,nav a,.brand b{font-family:Mitr,"IBM Plex Sans Thai",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{padding:14px max(5vw,16px) 0;position:sticky;top:0;z-index:5;background:light-dark(rgba(255,250,252,.88),rgba(29,23,36,.9));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:16px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -8px #f59ac0}
.brand b{display:block;font-weight:500;font-size:18px;line-height:1.25}.brand small{color:var(--mute);font-size:13px;display:block}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:10px;scrollbar-width:none}
nav a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;text-decoration:none;color:var(--mute);border-radius:999px;min-height:44px;font-size:15px}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--ink);background:var(--grad)}
nav a .c{font:600 12px Mitr;background:var(--pinkD);color:#fff;border-radius:9px;padding:0 7px}
main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(5vw,16px) 64px}
h1{font-size:clamp(26px,3.6vw,40px);line-height:1.2;margin:0 0 4px;text-wrap:balance;font-weight:500}
h2{font-size:19px;margin:0 0 12px;font-weight:500;display:flex;align-items:center;gap:8px}
h2 svg{width:26px;height:26px;flex:none}
.sub{color:var(--mute);margin:0 0 22px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:20px;height:20px}
.btn.pri{background:linear-gradient(135deg,#ffb3cf,#d7c4fa);border-color:transparent;color:#3d2a45}
.btn.mint{background:linear-gradient(135deg,#b5ecd4,#bfe3ff);border-color:transparent;color:#1d3d34}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:hover{filter:brightness(1.03);transform:translateY(-1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible,.row:focus-visible,.kpi:focus-visible{outline:3px solid var(--lavD);outline-offset:2px}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:center;gap:16px;background:var(--grad);border-radius:28px;padding:clamp(20px,3vw,34px);margin-bottom:22px;overflow:hidden;color:#3d2a45}
.hero .sub{color:#6d5574;margin:0}.hero h1{color:#3d2a45}
.say{display:inline-block;margin-top:14px;background:rgba(255,255,255,.85);border-radius:18px 18px 18px 4px;padding:8px 16px;font-size:15px;font-weight:600;color:#a03566}
.doodles{position:absolute;inset:0;pointer-events:none;opacity:.55}
.mascot{width:100%;max-width:230px;height:auto;justify-self:end;position:relative}
.kpis{display:grid;grid-template-columns:1.35fr repeat(4,minmax(0,1fr));gap:12px;margin-bottom:26px}
.kpi{border:1.5px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:8px}
.kpi .ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center}.kpi .ic svg{width:28px;height:28px}
.kpi .n{font:500 clamp(30px,4vw,42px)/1 Mitr}
.kpi span{color:var(--mute);font-size:14px}
.kpi.hot{background:linear-gradient(135deg,#ffb3cf,#ffd6a8);border-color:transparent;color:#4a1830;box-shadow:0 14px 30px -18px #f27aa8}
.kpi.hot span{color:#6b2a48}.kpi.hot .n{font-size:clamp(44px,6vw,66px)}.kpi.hot .ic{background:rgba(255,255,255,.7)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-bottom:22px}
.card{border:1.5px solid var(--line);border-radius:24px;padding:20px;background:var(--card)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .main{flex:1}.row .t{font-weight:600}.row .m{color:var(--mute);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.due{font:500 13px Mitr,"IBM Plex Sans Thai";white-space:nowrap;padding:3px 10px;border-radius:999px;background:var(--soft)}
.due.late{background:var(--late);color:var(--lateInk)}.due.soon{background:var(--soon);color:var(--soonInk)}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--mute)}
.tag.waiting{background:light-dark(#efe6ff,#3a2e55);color:var(--lavD)}.tag.done{background:light-dark(#dff6ea,#21402f);color:var(--mintD)}
.tag.mail{background:light-dark(#e3f2ff,#22364a);color:light-dark(#2a6aa8,#9fd0ff);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.tag.mail svg{width:14px;height:14px}
.datebox{width:54px;flex:none;align-self:flex-start;text-align:center;border-radius:16px;background:linear-gradient(160deg,#ffe0ec,#e7ddff);padding:6px 0;color:#3d2a45}
.datebox b{display:block;font:500 22px/1.1 Mitr}.datebox small{font-size:12px;color:#6d5574}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:8em 1fr 2.5em;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:6px}
.bar .v{text-align:right;font:500 14px Mitr}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tools input[type=search]{flex:1 1 220px;min-height:44px;border:1.5px solid var(--line);border-radius:999px;padding:0 18px;background:var(--card);font-size:16px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:#3d2a45;font-weight:600}
.chk{appearance:none;width:26px;height:26px;flex:none;border-radius:9px;border:2px solid #f2b5cd;background:var(--card);cursor:pointer;display:grid;place-items:center}
.chk:checked{background:linear-gradient(135deg,#b5ecd4,#8fdcbb);border-color:#8fdcbb}
.chk:checked::after{content:"";width:7px;height:12px;border:solid #1d5a42;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{padding:24px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:22px}
.ev{display:flex;gap:16px;padding:16px 0;border-top:1.5px dashed var(--line)}.ev:first-child{border-top:0}
.prep{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.prep label{display:flex;gap:8px;align-items:center;cursor:pointer}.prep .chk{width:20px;height:20px;border-radius:7px}
.prep .chk:checked::after{width:5px;height:9px;border-width:0 2.5px 2.5px 0}
.prog{height:8px;background:var(--soft);border-radius:4px;margin-top:8px;max-width:260px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#b5ecd4,#bfe3ff);border-radius:4px}
dialog{border:0;border-radius:26px;padding:0;width:min(580px,94vw);background:var(--bg);color:var(--ink);box-shadow:0 24px 60px rgba(80,40,90,.3)}
dialog::backdrop{background:rgba(61,42,69,.4)}
.dlg{padding:24px}.dlg h2{font-size:21px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.f label{font-size:14px;font-weight:600}
.f input,.f select,.f textarea,.ai select,.ai textarea{min-height:44px;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--card);font-size:16px;width:100%}
.f textarea,.ai textarea{min-height:90px;resize:vertical}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.acts .del{margin-right:auto;color:var(--lateInk)}
.log{list-style:none;padding:0;margin:0 0 12px;font-size:14px;max-height:220px;overflow:auto}
.log li{padding:8px 0;border-top:1.5px dashed var(--line)}.log time{color:var(--mute);font:500 12px Mitr;margin-right:8px}
.kv{display:grid;grid-template-columns:6em 1fr;gap:4px 12px;font-size:15px;margin-bottom:16px}.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.ai{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px}
.out{white-space:pre-wrap;min-height:320px;border:1.5px solid var(--line);border-radius:22px;padding:20px;background:var(--card);font-size:16px}
.out.wait{color:var(--mute)}
.imp{list-style:none;padding:0;margin:0 0 12px;max-height:52vh;overflow:auto}
.imp li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1.5px dashed var(--line)}
.imp li:first-child{border-top:0}.imp .m{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#3d2a45;color:#fff;padding:10px 18px;border-radius:999px;display:none;gap:12px;align-items:center;z-index:20;max-width:92vw}
.toast.show{display:flex}.toast button{background:none;border:0;color:#ffc2d9;font-weight:700;cursor:pointer;min-height:36px}
.lock{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--g1),var(--g2) 35%,var(--g3) 70%,var(--g4))}
.lock .box{width:min(400px,100%);background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:28px;text-align:center;box-shadow:0 24px 60px -30px rgba(122,79,208,.5)}
.lock h2{justify-content:center;font-size:22px}.lock input{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:16px;text-align:center;font:500 26px Mitr;letter-spacing:.4em;background:var(--bg);margin:6px 0 12px}
.lock .err{color:var(--lateInk);min-height:1.6em;font-size:14px;margin:0}
.note{font-size:13px;color:var(--mute);margin-top:20px}
.status{font-size:13px;color:var(--mute)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.hot{grid-column:1/-1}.grid2,.ai{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr) 110px}.bar{grid-template-columns:6.5em 1fr 2em}.row{flex-wrap:wrap}.row .main{flex-basis:60%}nav a span.lb{display:none}nav a.on span.lb{display:inline}}
@media(prefers-reduced-motion:no-preference){.bar .tr i,.prog i{transition:width .5s ease}.mascot .bob{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}.btn{transition:transform .15s}}
</style>
<!--__SBJS__-->
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true" id="logo"></div>
      <div><b>Contact & Follow-up Tracker</b><small>สมาคมการค้าอาหารอนาคตไทย · Thai Future Food Trade Association</small></div>
    </div>
    <span class="status" id="status">กำลังโหลดข้อมูล…</span>
  </div>
  <nav id="nav">
    <a href="#overview" data-v="overview" data-i="home" aria-label="ภาพรวม"><span class="lb">ภาพรวม</span></a>
    <a href="#contacts" data-v="contacts" data-i="people" aria-label="ผู้ติดต่อ"><span class="lb">ผู้ติดต่อ</span></a>
    <a href="#tasks" data-v="tasks" data-i="clip" aria-label="งานติดตาม"><span class="lb">งานติดตาม</span></a>
    <a href="#events" data-v="events" data-i="cal" aria-label="ประชุม & กิจกรรม"><span class="lb">ประชุม & กิจกรรม</span></a>
    <a href="#assistant" data-v="assistant" data-i="spark" aria-label="ผู้ช่วย AI"><span class="lb">ผู้ช่วย AI</span></a>
  </nav>
</header>
<main id="app"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo" type="button">เลิกทำ</button></div>
<script>
{
/* ---------- cute icons ---------- */
const IC={
 home:'<svg viewBox="0 0 32 32"><path d="M5 15 16 6l11 9v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="#ffd0e1" stroke="#d6457c" stroke-width="2" stroke-linejoin="round"/><path d="M16 23s-4-2.4-4-5a2 2 0 0 1 4-.6 2 2 0 0 1 4 .6c0 2.6-4 5-4 5z" fill="#ff7fa8"/></svg>',
 people:'<svg viewBox="0 0 32 32"><circle cx="12" cy="11" r="5" fill="#ffe0b8" stroke="#d9862b" stroke-width="2"/><circle cx="22" cy="13" r="4" fill="#d7f3e5" stroke="#3a9a70" stroke-width="2"/><path d="M3 26c0-5 4-8 9-8s9 3 9 8z" fill="#ffd0e1" stroke="#d6457c" stroke-width="2" stroke-linejoin="round"/><path d="M19 26c0-3 1-5 4-6 4 0 6 3 6 6z" fill="#e3d8fd" stroke="#7a4fd0" stroke-width="2" stroke-linejoin="round"/></svg>',
 clip:'<svg viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="23" rx="5" fill="#e3d8fd" stroke="#7a4fd0" stroke-width="2"/><rect x="11" y="3" width="10" height="6" rx="3" fill="#ffb3cf" stroke="#d6457c" stroke-width="2"/><path d="m10 16 3 3 5-6" fill="none" stroke="#3a9a70" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 17h3M11 24h11" stroke="#a98ee6" stroke-width="2.4" stroke-linecap="round"/></svg>',

 leaf:'<svg viewBox="0 0 32 32"><path d="M6 26C6 13 14 6 27 5c0 13-7 21-21 21z" fill="#c9f0dc" stroke="#3a9a70" stroke-width="2" stroke-linejoin="round"/><path d="M6 26 20 12" stroke="#3a9a70" stroke-width="2" stroke-linecap="round"/></svg>',
 bowl:'<svg viewBox="0 0 32 32"><path d="M4 15h24a12 10 0 0 1-24 0z" fill="#ffd6a8" stroke="#d9862b" stroke-width="2" stroke-linejoin="round"/><path d="M12 12c0-3 2-4 2-7M17 12c0-3 2-4 2-7" stroke="#ffb3cf" stroke-width="2" stroke-linecap="round"/></svg>',
 gmail:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor" opacity=".25"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>'};
const I=n=>IC[n]||'';
/* Nong Tua — an original soybean-sprout mascot */
const MASCOT=cls=>`<svg class="${cls}" viewBox="0 0 220 230" role="img" aria-label="น้องถั่ว มาสคอตถั่วงอกถือคลิปบอร์ด"><g class="bob">
<ellipse cx="110" cy="220" rx="64" ry="8" fill="#7a4fd0" opacity=".12"/>
<path d="M110 46c0-14 2-24 6-32" fill="none" stroke="#3a9a70" stroke-width="5" stroke-linecap="round"/>
<path d="M114 20c10-14 30-16 40-8-8 14-28 16-40 8z" fill="#b5ecd4" stroke="#3a9a70" stroke-width="3" stroke-linejoin="round"/>
<path d="M112 24c-10-12-28-14-38-6 8 13 26 14 38 6z" fill="#c9f0dc" stroke="#3a9a70" stroke-width="3" stroke-linejoin="round"/>

<path d="M74 70c8-10 20-14 30-14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
<ellipse cx="88" cy="112" rx="7.5" ry="9.5" fill="#3d2a45"/><ellipse cx="132" cy="112" rx="7.5" ry="9.5" fill="#3d2a45"/>
<circle cx="90" cy="108" r="2.6" fill="#fff"/><circle cx="134" cy="108" r="2.6" fill="#fff"/>
<ellipse cx="72" cy="128" rx="11" ry="7" fill="#ffb3cf" opacity=".85"/><ellipse cx="148" cy="128" rx="11" ry="7" fill="#ffb3cf" opacity=".85"/>
<path d="M102 126q8 8 16 0" fill="none" stroke="#3d2a45" stroke-width="3.2" stroke-linecap="round"/>
<g transform="rotate(-5 110 172)"><rect x="76" y="140" width="68" height="62" rx="10" fill="#fff" stroke="#c78ad8" stroke-width="3"/>

function dueTag(t){
  if(t.status==='done')return '<span class="tag done">เสร็จแล้ว</span>';
  const n=daysTo(t.due);if(n===null)return '<span class="due">ไม่กำหนด</span>';
  if(n<0)return `<span class="due late">เลย ${-n} วัน</span>`;
  if(n===0)return '<span class="due soon">วันนี้</span>';
  return `<span class="due${n<=3?' soon':''}">อีก ${n} วัน</span>`;
}

const ENC=null/*__ENC__*/;let KEY=null,SALT=null;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pin,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encSave(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(S)));try{localStorage.setItem('cft-enc',JSON.stringify({salt:b64(SALT),iv:b64(iv),ct:b64(ct)}))}catch(e){}}
function saveLocal(){if(KEY){encSave();return}try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function showLock(){
  const el=document.createElement('div');el.className='lock';
  el.innerHTML=`<form class="box" id="lockF">${MASCOT('').replace('<svg','<svg width="120" height="126"')}<h2>${I('leaf')}ใส่ PIN เพื่อเปิดข้อมูล</h2><p class="sub" style="margin:0">ข้อมูลผู้ติดต่อและงานของสมาคมถูกเข้ารหัสไว้</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN" required autofocus><p class="err" id="pinErr"></p><button class="btn pri" style="width:100%;justify-content:center">ปลดล็อก</button></form>`;
  document.body.appendChild(el);
  $('#lockF').onsubmit=async e=>{e.preventDefault();const err=$('#pinErr');err.textContent='กำลังตรวจสอบ…';
    let saved=null;try{saved=JSON.parse(localStorage.getItem('cft-enc'))}catch(x){}
    const src=saved&&saved.ct?saved:ENC;
    try{SALT=unb64(src.salt);KEY=await deriveKey($('#pin').value.trim(),SALT);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(src.iv)},KEY,unb64(src.ct));
      const d=JSON.parse(new TextDecoder().decode(pt));S.contacts=d.contacts||[];S.tasks=d.tasks||[];S.events=d.events||[];
      el.remove();route();$('#status').innerHTML='ปลดล็อกแล้ว · บันทึกแบบเข้ารหัสในเบราว์เซอร์นี้ <button class="btn sm" id="relock" type="button">ล็อก</button>';
      $('#relock').onclick=()=>{KEY=null;location.reload()};
    }catch(x){KEY=null;err.textContent='PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง';$('#pin').select()}};
}

const clean=o=>{const x=JSON.parse(JSON.stringify(o));delete x.id;return x};
async function put(col,obj,quiet){
  if(!obj.id)obj.id=uid();
  if(sb){const{error}=await sb.from('tracker_'+col).upsert({id:obj.id,data:clean(obj)});if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return false}}
  else if(live){try{await db.collection(col).doc(obj.id).set(clean(obj))}catch(e){toast('บันทึกไม่สำเร็จ: '+(e.message||e.code));return false}}
  const a=S[col],i=a.findIndex(x=>x.id===obj.id);i<0?a.push(obj):a[i]=obj;
  if(!live&&!sb)saveLocal();if(!quiet)render();return true;
}
async function del(col,id){
  const obj=S[col].find(x=>x.id===id);if(!obj)return;
  if(sb){const{error}=await sb.from('tracker_'+col).delete().eq('id',id);if(error){toast('ลบไม่สำเร็จ: '+error.message);return}}
  else if(live){try{await db.collection(col).doc(id).delete()}catch(e){toast('ลบไม่สำเร็จ');return}}
  S[col]=S[col].filter(x=>x.id!==id);if(!live&&!sb)saveLocal();
  lastDel={col,obj};toast('ลบแล้ว',true);render();
}

  try{
    const out=await sample.json(`คุณคือผู้ช่วยผู้ประสานงานของ${ORG} วันนี้คือ ${plus(0)}
อ่านรายการอีเมลต่อไปนี้ (JSON) แล้วเลือกเฉพาะอีเมลที่มี "งานที่ต้องทำ" หรือ "ต้องติดตาม/รอคำตอบ" สำหรับผู้ประสานงาน ข้ามอีเมลโฆษณา/แจ้งเพื่อทราบที่ไม่ต้องทำอะไร
ตอบเป็น JSON object รูปแบบ {"tasks":[{"threadId":"","title":"สั้น กระชับ ขึ้นต้นด้วยคำกริยา","due":"YYYY-MM-DD หรือ \\"\\" ถ้าไม่ทราบ","status":"todo หรือ waiting","priority":"สูง หรือ ปกติ","contactName":"","contactEmail":"","note":"1 บรรทัด"}]}
ห้ามแต่งวันที่ที่ไม่มีในอีเมล
อีเมล: ${JSON.stringify(threads)}`,{modelTier:'default'});
    found=((out&&out.tasks)||[]).filter(t=>t&&t.title&&threads.some(x=>x.id===t.threadId));
  }catch(e){msg.textContent=e&&e.code==='rate_limited'?'ใช้ AI ถี่เกินไป ลองใหม่ในอีกสักครู่':'AI สรุปงานไม่สำเร็จ ลองใหม่อีกครั้ง';return}
  if(!found.length){msg.textContent='อ่านแล้ว ไม่พบงานที่ต้องทำหรือติดตามในอีเมลใหม่';return}
  msg.textContent=`พบ ${found.length} งาน — เลือกงานที่ต้องการเพิ่ม`;
  $('#impList').innerHTML=found.map((t,i)=>`<li><input type="checkbox" class="chk" data-pick="${i}" checked aria-label="เลือก"><div><div style="font-weight:600">${esc(t.title)}</div><div class="m">${esc(t.contactName||t.contactEmail||'')} · ${t.due?thD(t.due):'ไม่กำหนด'} · ${t.status==='waiting'?'รอตอบกลับ':'ต้องทำ'}</div><div class="m">${esc(t.note||'')}</div></div></li>`).join('');
  const add=$('#iAdd');add.disabled=false;
  add.onclick=async()=>{add.disabled=true;let n=0;
    for(const el of document.querySelectorAll('[data-pick]')){if(!el.checked)continue;const t=found[+el.dataset.pick];
      let c=S.contacts.find(x=>t.contactEmail&&x.email&&x.email.toLowerCase()===String(t.contactEmail).toLowerCase());
      if(!c&&(t.contactName||t.contactEmail)){c={id:uid(),name:String(t.contactName||t.contactEmail).slice(0,80),role:'',org:'',group:'องค์กรภายนอก',phone:'',email:String(t.contactEmail||'').slice(0,120),notes:'เพิ่มจาก Gmail',log:[]};await put('contacts',c,true)}
      const due=/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'';
      if(await put('tasks',{title:String(t.title).slice(0,200),contactId:c?c.id:'',due,status:t.status==='waiting'?'waiting':'todo',priority:t.priority==='สูง'?'สูง':'ปกติ',note:String(t.note||'').slice(0,500),link:'https://mail.google.com/mail/u/0/#all/'+encodeURIComponent(t.threadId),threadId:t.threadId,source:'gmail'},true))n++}
    $('#dlg').close();render();toast(`เพิ่ม ${n} งานจากอีเมลแล้ว`)};
}

/* ---------- AI ---------- */
function aiContext(){
  const c=S.contacts.find(x=>x.id===$('#aiC').value),t=S.tasks.find(x=>x.id===$('#aiT').value),e=S.events.find(x=>x.id===$('#aiE').value);
  return {type:$('#aiType').value,tone:$('#aiTone').value,extra:$('#aiX').value.trim(),c,t,e};
}
function aiPrompt(x){
  const en=x.tone.startsWith('ภาษาอังกฤษ');
  const parts=[`คุณคือผู้ช่วยของผู้ประสานงาน${ORG} (Thai Future Food Trade Association) ช่วยร่าง "${AIT[x.type]}" ${en?'เป็นภาษาอังกฤษ น้ำเสียงทางการ':'เป็นภาษาไทย น้ำเสียง'+x.tone}`];
  if(x.c)parts.push(`ผู้รับ: ${x.c.name} ตำแหน่ง ${x.c.role||'-'} หน่วยงาน ${x.c.org||'-'} (กลุ่ม ${x.c.group})`);
  if(x.t)parts.push(`เรื่องที่ติดตาม: ${x.t.title} กำหนด ${thD(x.t.due)} สถานะ ${TS[x.t.status]}${x.t.note?' รายละเอียด: '+x.t.note:''}`);
  if(x.e)parts.push(`ประชุม/กิจกรรม: ${x.e.title} (${x.e.type}) วันที่ ${thD(x.e.date)} เวลา ${x.e.time||'-'} สถานที่ ${x.e.place||'-'} ผู้เข้าร่วม ${x.e.attendees||'-'}`);
  if(x.extra)parts.push(`ข้อมูลเพิ่มเติมจากผู้ใช้:\n${x.extra}`);
  const fmt={followup:'มีหัวเรื่องอีเมล (บรรทัดแรกขึ้นต้นด้วย "เรื่อง:") คำขึ้นต้น เนื้อหากระชับ ขอคำตอบภายในวันที่ชัดเจน และคำลงท้าย',
   invite:'รูปแบบหนังสือเชิญ มี เรื่อง เรียน เนื้อหา (วัน เวลา สถานที่ วัตถุประสงค์) ขอให้ยืนยันการเข้าร่วม และลงท้าย "ขอแสดงความนับถือ"',
   minutes:'รูปแบบรายงานการประชุม: หัวข้อ วันเวลาสถานที่ ผู้เข้าร่วม สรุปประเด็นตามวาระ มติที่ประชุม และตารางงานที่ต้องทำต่อ (งาน / ผู้รับผิดชอบ / กำหนด) ถ้าข้อมูลไม่มี ให้เว้น [ ] ไว้ให้กรอก ห้ามแต่งข้อเท็จจริง',
   reminder:'ข้อความสั้นไม่เกิน 3 บรรทัด สุภาพ เหมาะส่งทาง LINE หรือ SMS',
   reply:'อีเมลตอบกลับสั้น ๆ ยืนยันการเข้าร่วม/รับทราบ ระบุชื่อผู้เข้าร่วมถ้ามี และขอบคุณ'}[x.type];
  parts.push(`รูปแบบ: ${fmt}\nลงชื่อผู้ส่งว่า "ผู้ประสานงาน ${ORG}" ห้ามใช้ markdown ตอบเฉพาะตัวเอกสาร`);
  return parts.join('\n\n');
}
function aiTemplate(x){
  const to=x.c?x.c.name:'[ชื่อผู้รับ]',ev=x.e,t=x.t,sig='ผู้ประสานงาน\n'+ORG;
  if(x.type==='followup')return `เรื่อง: ติดตาม${t?t.title:'[เรื่อง]'}\n\nเรียน ${to}\n\nตามที่${ORG}ได้ประสานเรื่อง${t?t.title:'[เรื่อง]'}ไว้ก่อนหน้านี้ จึงขอติดตามความคืบหน้า และขอความกรุณาแจ้งผลภายในวันที่ ${t?thD(t.due):'[วันที่]'}\n${x.extra?'\n'+x.extra+'\n':''}\nขอขอบพระคุณเป็นอย่างสูง\n${sig}`;
  if(x.type==='invite')return `เรื่อง ขอเชิญเข้าร่วม${ev?ev.title:'[ชื่องาน]'}\nเรียน ${to}\n\nด้วย${ORG}กำหนดจัด${ev?ev.title:'[ชื่องาน]'} ในวันที่ ${ev?thD(ev.date):'[วันที่]'} เวลา ${ev?.time||'[เวลา]'} น. ณ ${ev?.place||'[สถานที่]'}\n\nจึงเรียนมาเพื่อขอเชิญท่านเข้าร่วม และขอความกรุณายืนยันการเข้าร่วมภายในวันที่ [วันที่]\n\nขอแสดงความนับถือ\n${sig}`;
  if(x.type==='minutes')return `รายงานการประชุม ${ev?ev.title:'[ชื่อการประชุม]'}\nวันที่ ${ev?thD(ev.date):'[ ]'} เวลา ${ev?.time||'[ ]'} ณ ${ev?.place||'[ ]'}\nผู้เข้าร่วม: ${ev?.attendees||'[ ]'}\n\nสรุปประเด็น\n${x.extra||'[ ]'}\n\nมติที่ประชุม\n[ ]\n\nงานที่ต้องทำต่อ\n- [งาน] / [ผู้รับผิดชอบ] / [กำหนด]`;
  if(x.type==='reply')return `เรียน ${to}\n\n${ORG} ขอขอบคุณสำหรับคำเชิญ${ev?' เข้าร่วม'+ev.title:t?' เรื่อง'+t.title:''} และขอยืนยันการเข้าร่วม โดยผู้เข้าร่วมคือ [ชื่อ-ตำแหน่ง]\n\nขอแสดงความนับถือ\n${sig}`;
  return `เรียน ${to} ขอเรียนแจ้งเตือน${t?' เรื่อง'+t.title+' กำหนด '+thD(t.due):ev?' '+ev.title+' วันที่ '+thD(ev.date)+' เวลา '+(ev.time||'')+' น.':' [เรื่อง]'} ขอบคุณค่ะ`;
}
async function runAI(){
  const x=aiContext(),out=$('#aiOut'),note=$('#aiNote');out.classList.remove('wait');
  if(!sample){out.textContent=aiTemplate(x);note.textContent='ผู้ช่วย AI ใช้งานไม่ได้ในมุมมองนี้ จึงแสดงร่างจากแม่แบบแทน แก้ไขได้ตามต้องการ';return}
  if(aiCtl)aiCtl.abort();aiCtl=new AbortController();
  out.textContent='กำลังร่าง…';note.textContent='';$('#aiGo').disabled=true;
  try{const r=await sample(aiPrompt(x),{signal:aiCtl.signal,cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text;note.textContent='ร่างโดย AI — โปรดตรวจทานชื่อ วันที่ และข้อเท็จจริงก่อนส่ง'}
  catch(e){if(e&&e.code==='not_granted'){sample=null}out.textContent=aiTemplate(x);note.textContent=e&&e.code==='rate_limited'?'ใช้ AI ถี่เกินไป ลองใหม่อีกครั้งในอีกสักครู่ — ระหว่างนี้แสดงร่างจากแม่แบบ':'เรียก AI ไม่สำเร็จ จึงแสดงร่างจากแม่แบบแทน'}
  finally{$('#aiGo').disabled=false}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')){e.stopPropagation();return}
  const el=e.target.closest('[data-done],[data-prep],[data-go],[data-new],[data-edit],[data-open],[data-cf],[data-tf],[data-ai],[data-import],#aiCopy');if(!el)return;
  const d=el.dataset;
  if(d.done!==undefined){const t=S.tasks.find(x=>x.id===d.done);put('tasks',{...t,status:el.checked?'done':'todo'});e.stopPropagation();return}
  if(d.prep!==undefined){const ev=S.events.find(x=>x.id===d.prep);const prep=ev.prep.map((p,i)=>i==d.i?{...p,done:el.checked}:p);put('events',{...ev,prep});return}
  if(d.import!==undefined)openImport();
  else if(d.go){if(d.f)tFilter=d.f;go(d.go)}
  else if(d.new)openForm(d.new);
  else if(d.edit)openForm(d.edit,d.id);
  else if(d.open)openContact(d.open);
  else if(d.cf){cFilter=d.cf;render()}
  else if(d.tf){tFilter=d.tf;render()}
  else if(d.ai){aiPre={type:d.ai,e:d.ev};go('assistant')}
  else if(el.id==='aiCopy'){const t=$('#aiOut').textContent;navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้ — เลือกข้อความแล้วคัดลอกเอง'))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='aiForm'){e.preventDefault();runAI()}});

/* ---------- boot ---------- */
if(SB){bootSB()}else if(ENC){showLock()}else{if(!loadLocal())demo();route();}
if(!ENC&&!SB)$('#status').innerHTML='โหมดสาธิต · ข้อมูลตัวอย่าง บันทึกในเครื่องนี้ <button class="btn sm" id="rst" type="button">รีเซ็ต</button>';{const r=$('#rst');if(r)r.onclick=()=>{try{localStorage.removeItem(LS)}catch(e){}location.reload()}}
(async()=>{try{sample=await claude.use('sample')}catch(e){sample=null}})();
(async()=>{try{mcp=await claude.use('mcp')}catch(e){mcp=null}})();
(async()=>{
  let d=null;try{d=await claude.use('db')}catch(e){}
  if(!d){return}
  db=d;const got={};let timer=setTimeout(()=>{$('#status').textContent='ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลอาจไม่เป็นปัจจุบัน'},10000);
  for(const col of ['contacts','tasks','events']){
    db.collection(col).onSnapshot(snap=>{
      if(!live){live=true;S.contacts=[];S.tasks=[];S.events=[]}
      S[col]=snap.docs.map(x=>({...x.data(),id:x.id}));got[col]=1;
      if(!snap.metadata.fromCache&&Object.keys(got).length===3){clearTimeout(timer);$('#status').textContent='ซิงก์ข้อมูลแล้ว ✓'}
      if(!$('#dlg').open||view!=='assistant')render();
    },err=>{clearTimeout(timer);$('#status').textContent='เชื่อมต่อฐานข้อมูลไม่ได้ ('+err.code+')'});
  }
})();
}
